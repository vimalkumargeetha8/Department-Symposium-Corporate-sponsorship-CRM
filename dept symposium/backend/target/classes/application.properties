# ==============================================================================
# Department Symposium Corporate Sponsorship CRM (Team CSBS G-06)
# Application Configuration Properties
# ==============================================================================

# Server Port Specification
server.port=8080

# Application Identity & Servlet Context
spring.application.name=dept-symposium-crm

# MySQL 8.0 Datasource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/dept_symposium_crm?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Enable SQL script initialization if tables need population
spring.sql.init.mode=never

# Logging Configuration
logging.level.com.aiht.symposium.crm=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
